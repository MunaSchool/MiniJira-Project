services:
  backend:
    build:
      context: ./mini-jira-backend
    ports:
      - "3000:3000"
    env_file:
      - ./mini-jira-backend/.env
    environment:
      - NODE_ENV=development
      - PORT=3000

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5174"
    env_file:
      - ./frontend/.env
    depends_on:
      - backend
    command: npm run dev -- --host 0.0.0.0 --port 5174
